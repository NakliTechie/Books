name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify deploy artifact module graph
        run: |
          test -f dist/index.html
          test -f dist/semantic-library.js
          test -f dist/semantic-processing.js
          test -f dist/semantic-ai.js
          test -f dist/_headers
      - run: npx wrangler deploy --dry-run
