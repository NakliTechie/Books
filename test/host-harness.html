<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books host harness</title>
  <style>
    html, body { width:100%; height:100%; margin:0; }
    body { display:grid; grid-template-rows:auto minmax(0, 1fr); background:#1f2522; }
    iframe { width:100%; height:100%; border:0; background:#fff; }
    #harness-bar {
      display:flex; align-items:center; gap:10px; padding:8px 12px;
      color:#f5f1e8; font:12px/1.4 ui-monospace, SFMono-Regular, monospace;
    }
    #harness-run {
      border:1px solid #7d9186; border-radius:5px; padding:5px 9px;
      background:#edf0e9; color:#202522; cursor:pointer; font:inherit;
    }
    #harness-run:disabled { opacity:.55; cursor:wait; }
    #harness-status[data-state="pass"] { color:#91d7a3; }
    #harness-status[data-state="fail"] { color:#ff9b8d; }
  </style>
</head>
<body>
<div id="harness-bar">
  <button id="harness-run" type="button">Run EPUB regression</button>
  <span id="harness-status" role="status">Ready · Folder and Crate are isolated</span>
</div>
<iframe id="books" title="Books test app" src="../index.html"></iframe>
<script>
(() => {
  const frame = document.getElementById('books');
  const runButton = document.getElementById('harness-run');
  const status = document.getElementById('harness-status');
  const encoder = new TextEncoder();

  function concatBytes(chunks) {
    const output = new Uint8Array(chunks.reduce((sum, chunk) => sum + chunk.length, 0));
    let offset = 0;
    chunks.forEach((chunk) => { output.set(chunk, offset); offset += chunk.length; });
    return output;
  }

  function crc32(bytes) {
    let crc = 0xffffffff;
    for (const byte of bytes) {
      crc ^= byte;
      for (let bit = 0; bit < 8; bit += 1) {
        crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);
      }
    }
    return (crc ^ 0xffffffff) >>> 0;
  }

  function storedZip(entries) {
    const locals = [];
    const centrals = [];
    let localOffset = 0;
    for (const [name, content] of entries) {
      const nameBytes = encoder.encode(name);
      const data = typeof content === 'string' ? encoder.encode(content) : content;
      const checksum = crc32(data);
      const local = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0, true);
      lv.setUint16(8, 0, true);
      lv.setUint32(14, checksum, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, nameBytes.length, true);
      local.set(nameBytes, 30);
      locals.push(local, data);

      const central = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(central.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint32(16, checksum, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, localOffset, true);
      central.set(nameBytes, 46);
      centrals.push(central);
      localOffset += local.length + data.length;
    }
    const centralSize = centrals.reduce((sum, chunk) => sum + chunk.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, entries.length, true);
    ev.setUint16(10, entries.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, localOffset, true);
    return concatBytes([...locals, ...centrals, end]);
  }

  function minimalEpub() {
    return storedZip([
      ['mimetype', 'application/epub+zip'],
      ['META-INF/container.xml',
        '<?xml version="1.0"?>' +
        '<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">' +
        '<rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>' +
        '</rootfiles></container>'],
      ['OEBPS/content.opf',
        '<?xml version="1.0" encoding="UTF-8"?>' +
        '<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="book-id">' +
        '<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">' +
        '<dc:identifier id="book-id">urn:uuid:naklios-books-harness</dc:identifier>' +
        '<dc:title>Harness EPUB</dc:title><dc:creator>NakliOS</dc:creator>' +
        '<dc:language>en</dc:language><meta property="dcterms:modified">2026-01-01T00:00:00Z</meta>' +
        '</metadata><manifest>' +
        '<item id="cover" href="cover.svg" media-type="image/svg+xml" properties="cover-image"/>' +
        '<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>' +
        '<item id="one" href="chapter-1.xhtml" media-type="application/xhtml+xml"/>' +
        '<item id="two" href="chapter-2.xhtml" media-type="application/xhtml+xml"/>' +
        '</manifest><spine><itemref idref="one"/><itemref idref="two"/></spine></package>'],
      ['OEBPS/cover.svg',
        '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480">' +
        '<rect width="320" height="480" fill="#8d3f2f"/><text x="160" y="220" text-anchor="middle" ' +
        'font-family="serif" font-size="32" fill="white">Harness</text></svg>'],
      ['OEBPS/nav.xhtml',
        '<!doctype html><html xmlns="http://www.w3.org/1999/xhtml" ' +
        'xmlns:epub="http://www.idpf.org/2007/ops"><head><title>Contents</title></head>' +
        '<body><nav epub:type="toc"><ol><li><a href="chapter-1.xhtml">First</a></li>' +
        '<li><a href="chapter-2.xhtml">Second</a></li></ol></nav></body></html>'],
      ['OEBPS/chapter-1.xhtml',
        '<!doctype html><html xmlns="http://www.w3.org/1999/xhtml"><head><title>First</title></head>' +
        '<body><h1>First page</h1><p>This is the deterministic opening page.</p></body></html>'],
      ['OEBPS/chapter-2.xhtml',
        '<!doctype html><html xmlns="http://www.w3.org/1999/xhtml"><head><title>Second</title></head>' +
        '<body><h1>Second page</h1><p>This page proves navigation and hosted restoration.</p></body></html>'],
    ]);
  }

  function portableImportBundle() {
    const source = encoder.encode(
      'Imported Field Guide\n\nPortable originals and records remain user-owned.'
    );
    let binary = '';
    for (const byte of source) binary += String.fromCharCode(byte);
    const timestamp = '2026-07-30T12:00:00.000Z';
    return {
      bundleVersion: 1,
      recordType: 'books.portable-library',
      semanticSchemaVersion: 1,
      exportedAt: timestamp,
      libraryLabel: 'Harness export',
      assets: [{
        filename: 'Imported Field Guide.txt',
        byteLength: source.byteLength,
        dataBase64: btoa(binary),
      }],
      records: {
        works: [{
          schemaVersion: 1,
          recordType: 'books.work',
          workId: 'work_harness-import',
          title: 'Imported Field Guide',
          authors: [{ name: 'Portable Reader', source: 'user' }],
          metadataProvenance: { title: 'user', authors: 'user' },
          userMetadata: { rating: null, tags: ['portable'], shelves: [] },
          editions: [{
            editionId: 'edition_harness-import',
            language: 'en',
            identifiers: {},
            assetIds: ['asset_harness-import'],
            createdAt: timestamp,
            updatedAt: timestamp,
          }],
          assets: [{
            assetId: 'asset_harness-import',
            editionId: 'edition_harness-import',
            sourcePath: 'library/Imported Field Guide.txt',
            sourceFilename: 'Imported Field Guide.txt',
            format: 'txt',
            byteLength: source.byteLength,
            fingerprint: null,
            fingerprintStatus: 'pending',
            availability: 'available',
            importedAt: timestamp,
            updatedAt: timestamp,
          }],
          legacy: {
            bookIds: ['Imported_Field_Guide'],
            sourceFilenames: ['Imported Field Guide.txt'],
            sidecarPath: null,
          },
          createdAt: timestamp,
          updatedAt: timestamp,
        }],
        annotations: [],
        legacySidecars: [],
      },
      omittedRebuildableData: [
        'catalog/catalog.json',
        'passages/',
        'indexes/',
        'semantics/',
        'processing/',
        'covers/',
      ],
    };
  }

  let activeBackend = 'fsa';
  const stores = {
    fsa: new Map([
      ['library/Sample.md', new TextEncoder().encode(
        '# Sample book\n\nA quiet test book for NakliOS Books.\n\nSecond paragraph.'
      )],
      ['library/Harness.epub', minimalEpub()],
      ['notes/missing-book.json', JSON.stringify({
        schemaVersion: 1,
        bookId: 'missing-book',
        sourceFilename: 'Missing.epub',
        title: 'Missing Book',
        author: 'Test Reader',
        lastOpened: '2026-07-27T18:30:00.000Z',
        position: { engine: 'epub', fraction: 0.42, sectionIndex: 1 },
        bookmarks: [{ label: 'Keep this place', position: { fraction: 0.42 } }],
        note: 'This sidecar must survive while its book is unavailable.',
      })],
    ]),
    crate: new Map([
      ['library/Crate Book.txt', new TextEncoder().encode(
        'Crate Book\n\nThis library is separate from the mounted Folder.'
      )],
    ]),
  };

  const capabilities = () => ({
    type: 'naklios:capabilities',
    fs: true,
    fsBackend: activeBackend,
    fsBackends: [
      { id: 'fsa', label: 'Folder', name: 'Test Folder' },
      { id: 'crate', label: 'Crate', name: 'Test Crate' },
    ],
  });

  function send(message) {
    frame.contentWindow.postMessage(message, '*');
  }

  function bytesToText(value) {
    if (typeof value === 'string') return value;
    if (value instanceof ArrayBuffer) return new TextDecoder().decode(value);
    if (ArrayBuffer.isView(value)) return new TextDecoder().decode(value);
    return String(value ?? '');
  }

  function setStatus(message, state = '') {
    status.textContent = message;
    status.dataset.state = state;
  }

  function waitFor(check, label, timeout = 25000) {
    const started = performance.now();
    return new Promise((resolve, reject) => {
      const poll = () => {
        let value = null;
        try { value = check(); } catch (_) {}
        if (value) { resolve(value); return; }
        if (performance.now() - started >= timeout) {
          reject(new Error('Timed out waiting for ' + label));
          return;
        }
        setTimeout(poll, 50);
      };
      poll();
    });
  }

  function positionFromStore() {
    for (const [path, value] of stores.fsa.entries()) {
      if (!path.startsWith('notes/') || !path.endsWith('.json')) continue;
      const sidecar = JSON.parse(bytesToText(value));
      if (sidecar.sourceFilename === 'Harness.epub') return sidecar.position;
    }
    return null;
  }

  function jsonFromStore(path) {
    if (!stores.fsa.has(path)) return null;
    return JSON.parse(bytesToText(stores.fsa.get(path)));
  }

  function percent(text) {
    const match = String(text || '').match(/(\d+)%/);
    return match ? Number(match[1]) : -1;
  }

  async function runEpubRegression() {
    runButton.disabled = true;
    setStatus('Running · opening real EPUB fixture…');
    try {
      activeBackend = 'fsa';
      [...stores.fsa.entries()]
        .filter(([path, value]) =>
          path.startsWith('notes/') &&
          bytesToText(value).includes('"sourceFilename":"Harness.epub"'))
        .forEach(([path]) => stores.fsa.delete(path));
      send(capabilities());

      const app = frame.contentDocument;
      const row = await waitFor(
        () => app.querySelector('.row[data-filename="Harness.epub"]'),
        'Harness.epub in the hosted Folder library',
      );
      const initialCatalog = await waitFor(
        () => jsonFromStore('catalog/catalog.json'),
        'semantic catalog migration',
      );
      if (
        initialCatalog.recordType !== 'books.catalog'
        || !initialCatalog.aliases.sourceFilenames['Harness.epub']
        || !initialCatalog.aliases.sourceFilenames['Sample.md']
      ) {
        throw new Error('Semantic catalog did not preserve hosted source discovery');
      }
      const initialManifestPaths = [...stores.fsa.keys()]
        .filter((path) => /^catalog\/works\/work_.+\.json$/.test(path));
      if (initialManifestPaths.length !== 2) {
        throw new Error('Semantic migration did not create one manifest per source');
      }
      row.click();
      await waitFor(
        () => app.getElementById('reader').classList.contains('is-open') &&
          !app.getElementById('next-btn').hidden &&
          app.getElementById('reader-title').textContent.includes('Harness') &&
          percent(app.getElementById('reader-status').textContent) >= 0,
        'EPUB first page',
      );

      const readerStatus = app.getElementById('reader-status');
      const next = app.getElementById('next-btn');
      const prev = app.getElementById('prev-btn');
      app.getElementById('reader-search-btn').click();
      const searchInput = app.getElementById('reader-search-input');
      searchInput.value = 'deterministic';
      searchInput.dispatchEvent(new Event('input', { bubbles: true }));
      await waitFor(
        () => app.getElementById('reader-search-count').textContent.includes('1 of'),
        'EPUB in-book search result',
      );
      if (!app.getElementById('reader-search-excerpt').textContent.includes('deterministic')) {
        throw new Error('EPUB search did not surface its matching excerpt');
      }
      app.getElementById('reader-search-close').click();

      const initial = readerStatus.textContent;
      next.click();
      const advanced = await waitFor(
        () => percent(readerStatus.textContent) > percent(initial) ? readerStatus.textContent : '',
        'Next to advance the EPUB',
      );
      // Foliate emits relocation before its page transition promise fully settles.
      // Give the paginator one frame before issuing the inverse command so the
      // regression observes user-realistic sequential clicks rather than a race.
      await new Promise((resolve) => setTimeout(resolve, 250));
      prev.click();
      await waitFor(
        () => percent(readerStatus.textContent) < percent(advanced),
        'Previous to return toward the opening page',
      );
      await new Promise((resolve) => setTimeout(resolve, 250));
      next.click();
      await waitFor(
        () => percent(readerStatus.textContent) >= percent(advanced),
        'Next to restore the advanced page',
      );

      await waitFor(() => {
        const pos = positionFromStore();
        return pos && (pos.fraction > 0 || pos.sectionIndex > 0) ? pos : null;
      }, 'hosted sidecar position write');
      await waitFor(
        () => [...stores.fsa.keys()].some((path) => /^covers\/Harness-[a-z0-9-]+\.cover$/.test(path)),
        'cached EPUB cover thumbnail',
      );
      const saved = positionFromStore();
      app.getElementById('back-btn').click();
      const reopenedRow = await waitFor(
        () => app.querySelector('.row[data-filename="Harness.epub"]'),
        'library after closing the reader',
      );
      reopenedRow.click();
      await waitFor(
        () => app.getElementById('reader').classList.contains('is-open') &&
          percent(app.getElementById('reader-status').textContent) >= Math.round(saved.fraction * 100),
        'hosted EPUB position restoration',
      );
      app.getElementById('back-btn').click();
      await waitFor(
        () => app.querySelector(
          '#continue-section [data-continue-filename="Harness.epub"]'
        ),
        'Continue Reading rail after closing the restored book',
      );
      await waitFor(
        () => app.querySelector(
          '#orphan-section [data-recover-sidecar="missing-book.json"]'
        ),
        'visible recovery entry for an orphaned sidecar',
      );
      const recoveryInput = app.getElementById('orphan-recovery-input');
      const chooseRecoveryFile = (name) => {
        const transfer = new DataTransfer();
        transfer.items.add(new File([minimalEpub()], name, { type: 'application/epub+zip' }));
        recoveryInput.files = transfer.files;
        recoveryInput.dispatchEvent(new Event('change', { bubbles: true }));
      };

      app.querySelector('[data-recover-sidecar="missing-book.json"]').click();
      chooseRecoveryFile('Wrong.epub');
      await waitFor(
        () => app.getElementById('toast').textContent.includes('Reading data was not rebound'),
        'mismatched recovery refusal',
      );
      if (stores.fsa.has('library/Wrong.epub') || stores.fsa.has('library/Missing.epub')) {
        throw new Error('Mismatched recovery wrote a book file');
      }

      app.querySelector('[data-recover-sidecar="missing-book.json"]').click();
      chooseRecoveryFile('Missing.epub');
      await waitFor(
        () => app.getElementById('reader').classList.contains('is-open') &&
          app.getElementById('reader-title').textContent.includes('Missing Book') &&
          app.getElementById('note-area').value.includes('must survive') &&
          app.getElementById('bookmarks-list').textContent.includes('Keep this place'),
        'exact-file recovery with original reading data',
      );
      await new Promise((resolve) => setTimeout(resolve, 1200));
      if (!stores.fsa.has('notes/missing-book.json') || stores.fsa.has('notes/Missing.json')) {
        throw new Error('Recovery rebound the orphan to a different sidecar');
      }
      const recoveredCatalog = jsonFromStore('catalog/catalog.json');
      const recoveredWorkId = recoveredCatalog?.aliases?.sourceFilenames?.['Missing.epub'];
      const recoveredAnnotations = recoveredWorkId
        ? jsonFromStore('annotations/' + recoveredWorkId + '.json')
        : null;
      if (
        !recoveredWorkId
        || recoveredAnnotations?.recordType !== 'books.annotations'
        || !recoveredAnnotations.annotations.some(
          (annotation) => annotation.kind === 'note'
            && annotation.body.includes('must survive')
        )
        || !recoveredAnnotations.annotations.some(
          (annotation) => annotation.kind === 'bookmark'
        )
      ) {
        throw new Error('Recovered v1 reading data was not migrated portably');
      }
      const sampleWorkId = recoveredCatalog?.aliases?.sourceFilenames?.['Sample.md'];
      const sampleJob = await waitFor(() => {
        const job = sampleWorkId
          ? jsonFromStore('jobs/' + sampleWorkId + '.json')
          : null;
        return job?.stages?.deterministicSemantics?.status === 'complete'
          ? job : null;
      }, 'local background semantic processing');
      const samplePassages = jsonFromStore(
        'semantic/' + sampleWorkId + '/passages.json'
      );
      const sampleIndex = jsonFromStore('indexes/works/' + sampleWorkId + '.json');
      const sampleSemantics = jsonFromStore(
        'semantic/' + sampleWorkId + '/records.json'
      );
      if (
        sampleJob.stages.fingerprint.status !== 'complete'
        || !samplePassages?.passages?.length
        || sampleIndex?.recordType !== 'books.lexical-index'
        || !sampleSemantics?.concepts?.length
        || !sampleSemantics.concepts.every(
          (concept) => concept.evidence?.every((item) => item.passageId)
        )
      ) {
        throw new Error('Local semantic pipeline did not produce grounded records');
      }
      app.getElementById('back-btn').click();
      const semanticSearch = await waitFor(
        () => app.getElementById('semantic-search-input'),
        'library semantic search control',
      );
      semanticSearch.value = 'quiet';
      semanticSearch.dispatchEvent(new Event('input', { bubbles: true }));
      const semanticResult = await waitFor(
        () => app.querySelector('[data-semantic-result]'),
        'library semantic passage result',
      );
      if (!semanticResult.textContent.includes('Sample')) {
        throw new Error('Semantic search result did not identify its source work');
      }
      semanticResult.click();
      await waitFor(
        () => app.getElementById('reader').classList.contains('is-open')
          && app.getElementById('reader-title').textContent.includes('Sample')
          && app.getElementById('reader-status').textContent.includes('Search result'),
        'semantic result faithful-reader navigation',
      );
      const readerMode = app.getElementById('reader-mode-btn');
      if (readerMode.hidden) {
        throw new Error('Native mode was unavailable after passage processing');
      }
      readerMode.click();
      const nativePassage = await waitFor(
        () => readerMode.getAttribute('aria-pressed') === 'true'
          && app.querySelector('.native-passage[data-passage-id]'),
        'Books-native passage rendering',
      );
      if (!nativePassage.textContent.includes('quiet test book')) {
        throw new Error('Native mode did not preserve authored passage text');
      }
      const selectedParagraph = Array.from(
        nativePassage.querySelectorAll('p')
      ).find((paragraph) => paragraph.textContent.includes('quiet test book'));
      const selectedText = selectedParagraph.firstChild;
      const selectedStart = selectedText.data.indexOf('quiet test book');
      const selectedRange = app.createRange();
      selectedRange.setStart(selectedText, selectedStart);
      selectedRange.setEnd(selectedText, selectedStart + 'quiet test book'.length);
      const appSelection = app.defaultView.getSelection();
      appSelection.removeAllRanges();
      appSelection.addRange(selectedRange);
      app.getElementById('add-highlight-btn').click();
      await waitFor(
        () => app.getElementById('highlight-dialog').open,
        'native highlight dialog',
      );
      app.getElementById('highlight-note').value = 'Portable highlight';
      app.getElementById('highlight-color').value = 'green';
      app.getElementById('highlight-form').requestSubmit();
      const portableHighlight = await waitFor(() => {
        const record = jsonFromStore('annotations/' + sampleWorkId + '.json');
        return record?.annotations?.find(
          (annotation) => annotation.kind === 'highlight'
            && annotation.target?.exact === 'quiet test book'
            && annotation.body === 'Portable highlight'
        );
      }, 'portable native highlight write');
      await waitFor(
        () => app.querySelector(
          'mark[data-annotation-id="' + portableHighlight.annotationId + '"]'
        ),
        'native inline highlight rendering',
      );
      app.querySelector('.native-source-link').click();
      await waitFor(
        () => readerMode.getAttribute('aria-pressed') === 'false'
          && !app.querySelector('.native-reader')
          && app.getElementById('reader-status').textContent.includes('Authored source'),
        'native passage route to faithful source',
      );
      app.getElementById('back-btn').click();
      const sampleRowAfterHighlight = await waitFor(
        () => !app.getElementById('reader').classList.contains('is-open')
          && app.querySelector('.row[data-filename="Sample.md"]'),
        'Sample work after highlight',
      );
      sampleRowAfterHighlight.click();
      await waitFor(
        () => app.getElementById('reader').classList.contains('is-open')
          && !app.getElementById('reader-mode-btn').hidden,
        'highlighted work reopen',
      );
      app.getElementById('reader-mode-btn').click();
      await waitFor(
        () => app.querySelector(
          'mark[data-annotation-id="' + portableHighlight.annotationId + '"]'
        ),
        'portable highlight restoration',
      );
      app.getElementById('reader-mode-btn').click();
      await waitFor(
        () => app.getElementById('reader-mode-btn').getAttribute('aria-pressed') === 'false',
        'return from restored native highlight',
      );
      app.getElementById('back-btn').click();
      const detailsButton = await waitFor(
        () => !app.getElementById('reader').classList.contains('is-open')
          && app.querySelector(
            '.row[data-filename="Sample.md"] [data-action="details"]'
          ),
        'portable work details button',
      );
      detailsButton.click();
      await waitFor(
        () => app.getElementById('work-details-dialog').open,
        'portable work details dialog',
      );
      app.getElementById('work-title-input').value = 'Sample Field Notes';
      app.getElementById('work-tags-input').value = 'research, local-first';
      app.getElementById('work-details-form').requestSubmit();
      await waitFor(() => {
        const catalog = jsonFromStore('catalog/catalog.json');
        const summary = catalog?.works?.find((work) => work.workId === sampleWorkId);
        return summary?.title === 'Sample Field Notes'
          && summary.tags.includes('local-first');
      }, 'portable work metadata write');
      if (
        !app.querySelector('.row[data-filename="Sample.md"]')
          ?.textContent.includes('Sample Field Notes')
      ) {
        throw new Error('Saved portable metadata did not refresh the work row');
      }
      app.getElementById('annotations-browser-btn').click();
      await waitFor(
        () => app.getElementById('annotations-browser-dialog').open
          && app.getElementById('annotations-browser-list')
            .textContent.includes('quiet test book'),
        'library-wide annotation browser',
      );
      const annotationSearch = app.getElementById('annotations-browser-search');
      annotationSearch.value = 'quiet test';
      annotationSearch.dispatchEvent(new Event('input', { bubbles:true }));
      if (!app.querySelector('[data-library-annotation]')) {
        throw new Error('Library annotation search lost its grounded highlight');
      }
      app.getElementById('annotations-browser-dialog').close();

      app.getElementById('library-tools-btn').click();
      await waitFor(
        () => app.getElementById('library-tools-dialog').open
          && app.getElementById('library-health').textContent.includes(
            'Library is readable'
          )
          && app.getElementById('library-health').textContent.includes(
            'exact-duplicate-assets'
          ),
        'library validation report',
      );
      app.getElementById('library-export-btn').click();
      await waitFor(
        () => app.getElementById('library-health').textContent.includes(
          'Exported originals and portable records'
        ),
        'portable library export',
      );
      const importTransfer = new DataTransfer();
      importTransfer.items.add(new File(
        [JSON.stringify(portableImportBundle())],
        'harness.books-library.json',
        { type:'application/json' },
      ));
      const importInput = app.getElementById('portable-library-import-input');
      importInput.files = importTransfer.files;
      importInput.dispatchEvent(new Event('change', { bubbles:true }));
      await waitFor(
        () => app.getElementById('confirm-dialog').open
          && app.getElementById('confirm-dialog-title').textContent.includes(
            'Import this portable library'
          ),
        'portable import confirmation after preflight',
      );
      app.getElementById('confirm-dialog-ok').click();
      await waitFor(
        () => stores.fsa.has('library/Imported Field Guide.txt')
          && stores.fsa.has('catalog/works/work_harness-import.json')
          && app.querySelector(
            '.row[data-filename="Imported Field Guide.txt"]'
          ),
        'conflict-safe portable library import',
      );

      setStatus(
        'PASS · semantic reading, annotation memory, recovery, and portability work',
        'pass',
      );
    } catch (error) {
      console.error('Books harness regression failed', error);
      setStatus('FAIL · ' + String(error && error.message || error), 'fail');
    } finally {
      runButton.disabled = false;
    }
  }

  window.addEventListener('message', (event) => {
    if (event.source !== frame.contentWindow) return;
    const msg = event.data;
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'naklios:ready' || msg.type === 'naklios:capabilities-request') {
      send(capabilities());
      return;
    }
    if (msg.type === 'naklios:theme-request') {
      send({
        type: 'naklios:theme',
        theme: 'test',
        colors: {
          body: '#f4f2ec',
          panel: '#fffdf8',
          ink: '#202522',
          brand: '#8d3f2f',
          row: '#ece8df',
          line: '#d6d0c5',
        },
      });
      return;
    }
    if (typeof msg.type !== 'string' || !msg.type.startsWith('naklios:fs:')) return;

    const op = msg.type.slice('naklios:fs:'.length);
    const reply = { type: 'naklios:fs:reply', requestId: msg.requestId };
    try {
      if (op === 'selectBackend') {
        if (!stores[msg.backend]) throw new Error('Unknown backend');
        activeBackend = msg.backend;
        reply.result = true;
        send(capabilities());
      } else {
        const store = stores[activeBackend];
        if (op === 'list') {
          const prefix = String(msg.prefix || '');
          reply.result = [...store.keys()].filter((path) => path.startsWith(prefix));
        } else if (op === 'exists') {
          reply.result = store.has(msg.path);
        } else if (op === 'read') {
          if (!store.has(msg.path)) throw new Error('Not found');
          reply.result = bytesToText(store.get(msg.path));
        } else if (op === 'readBinary') {
          if (!store.has(msg.path)) throw new Error('Not found');
          const value = store.get(msg.path);
          reply.result = typeof value === 'string' ? new TextEncoder().encode(value) : value;
        } else if (op === 'write') {
          store.set(msg.path, typeof msg.data === 'string' ? msg.data : new Uint8Array(msg.data));
          reply.result = null;
        } else if (op === 'delete') {
          store.delete(msg.path);
          reply.result = null;
        } else {
          throw new Error('Unsupported mock op: ' + op);
        }
      }
    } catch (error) {
      reply.error = String(error && error.message || error);
    }
    send(reply);
  });

  frame.addEventListener('load', () => {
    send(capabilities());
    send({
      type: 'naklios:theme',
      theme: 'test',
      colors: {
        body: '#f4f2ec',
        panel: '#fffdf8',
        ink: '#202522',
        brand: '#8d3f2f',
        row: '#ece8df',
        line: '#d6d0c5',
      },
    });
  });

  runButton.addEventListener('click', runEpubRegression);
  if (new URLSearchParams(location.search).get('autorun') === '1') {
    frame.addEventListener('load', () => setTimeout(runEpubRegression, 0), { once: true });
  }
})();
</script>
</body>
</html>
